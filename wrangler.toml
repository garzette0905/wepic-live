name = "wepic-live"
main = "cloudflare/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 프론트엔드 정적 자산은 web/public 을 그대로 서빙(복사 불필요).
# 정적 파일이 없는 경로(/api/*, /auth/*, /img, /video, /shares/*, /f/*, POST 등)는 Worker로 넘어간다.
[assets]
directory = "web/public"
binding = "ASSETS"
not_found_handling = "none"

# 공유 사진 저장용 R2 (대시보드에서 'wepic-shares' 버킷 먼저 생성)
[[r2_buckets]]
binding = "SHARES"
bucket_name = "wepic-shares"

# 로그인 세션 저장용 KV
[[kv_namespaces]]
binding = "SESSIONS"
id = "df7d7aa4228a478db2fb2779d41d0cd2"

# 회원 정보 저장용 D1 (SQL). 스키마는 저장소 루트의 schema.sql 참고.
#   생성:      npx wrangler d1 create wepic-db   → 출력된 database_id를 아래에 붙여넣기
#   스키마적용: npx wrangler d1 execute wepic-db --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "wepic-db"
database_id = "e464e97e-36a6-4459-850a-200981bbab3f"

[vars]
BASE_URL = "https://wepic-live.wepiclab.workers.dev"

# 예전에는 여기서 매시간 만료된 공유를 정리했으나, 자동 만료 삭제를 비활성화하면서
# (2026-07, 사용자 요청 — 따로 얘기하기 전까지 어떤 공유도 지우지 않음) 더 이상 아무 일도
# 하지 않는다(cloudflare/index.js의 scheduled 핸들러 참고). 크론 자체는 남겨둬도 무해하다.
[triggers]
crons = ["0 * * * *"]

# 시크릿은 대시보드(Settings → Variables and secrets, Encrypt)로 등록:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, KAKAO_CLIENT_ID, KAKAO_CLIENT_SECRET, SESSION_SECRET
#   NAVER_CLIENT_ID, NAVER_CLIENT_SECRET        (선택 — 네이버 로그인을 쓸 때만)
#   FACEBOOK_CLIENT_ID, FACEBOOK_CLIENT_SECRET  (선택 — 페이스북 로그인을 쓸 때만)
# 값이 없는 제공자는 로그인 화면에 "(준비중)"으로 비활성 표시되므로, 등록하는 즉시 켜진다.
#
# 네이버: https://developers.naver.com > 애플리케이션 등록
#   · 사용 API: "네이버 로그인" + "OpenID Connect" 사용 설정
#   · Callback URL: https://<BASE_URL>/auth/naver/callback
#   · 제공 정보(동의항목)에서 이름·이메일을 켜야 회원 이름이 채워진다.
#     (id_token 서명이 ES256이라 서버에서 ES256 검증을 함께 지원한다)
#
# 페이스북: https://developers.facebook.com > 앱 만들기 > "Facebook 로그인" 제품 추가
#   · 유효한 OAuth 리디렉션 URI: https://<BASE_URL>/auth/facebook/callback
#   · 앱 ID = FACEBOOK_CLIENT_ID, 앱 시크릿 코드 = FACEBOOK_CLIENT_SECRET
#   · 권한: public_profile, email (email은 앱 검수를 받아야 외부 사용자에게 열린다)
# 배경음악의 "음악찾기"(30초 미리듣기)는 iTunes Search API를 쓴다 —
# **API 키·앱 등록이 전혀 필요 없는 공개 엔드포인트**라 추가할 시크릿이 없다.
# 카카오 값은 카카오 개발자센터(https://developers.kakao.com) > 내 애플리케이션 > 앱 키의
# "REST API 키"(=KAKAO_CLIENT_ID)와 제품 설정 > 카카오 로그인 > 보안의 Client Secret
# (=KAKAO_CLIENT_SECRET)에서 발급받는다. 카카오 로그인 > Redirect URI에는
# https://<BASE_URL>/auth/kakao/callback 을 등록해야 한다.

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<!-- 확대는 이 화면이 직접 처리한다(핀치 → 사진 줌). 브라우저 자체 확대까지 겹치면
     주소창·아이콘까지 같이 커져 액자 화면이 흐트러지므로 브라우저 확대는 막는다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Wepic</title>
<!-- 공유 링크는 검색엔진에 색인되면 안 된다(링크를 아는 사람만 보는 페이지) -->
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Dancing+Script:wght@600&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
<!-- 한글 본문용 Pretendard (라틴은 Inter가 받는다) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="/styles.css?v=20260808e" />
<style>
  /* 공유 보기 전용: 사진이 화면 전체를 채우는 단순 슬라이드쇼 */
  .share-view { position: fixed; inset: 0; background: #000; overflow: hidden; }
  /* 사진·동영상 레이어를 한 겹 감싼 무대. 줌인/줌아웃은 이 무대 전체를 확대·이동시킨다
     (사진 <img>에 직접 걸면 켄번즈 애니메이션의 transform과 서로 덮어써서 튄다). */
  .photo-stage {
    position: absolute; inset: 0; transform-origin: center center;
    transition: transform 0.22s ease-out; will-change: transform;
  }
  /* 확대된 상태에서는 끌어서 옮길 수 있다(손가락·마우스 모두) */
  .photo-stage.zoomed { cursor: grab; touch-action: none; }
  .photo-stage.zoomed.grabbing { cursor: grabbing; transition: none; }
  .share-view .photo-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 1.4s ease-in-out; }
  .share-view .photo-layer.active { opacity: 1; }
  .share-view video.photo-layer { background: #000; }
  /* 전환 효과(공유 화면): 링크 생성 시점의 옵션이 fx-* 클래스로 적용됨. kenburns 키프레임은 styles.css에 정의됨 */
  .share-view.fx-slide .photo-layer { transition: opacity 1s ease, transform 1s ease; transform: translateX(6%); }
  .share-view.fx-slide .photo-layer.active { transform: translateX(0); }
  /* Ken Burns 확대는 사진에만 적용한다(동영상은 원본 그대로 재생) */
  /* 켄번즈는 .active가 아니라 .kb-run으로 건다 — .active로 걸면 전환 순간 사라지는
     레이어에서 애니메이션이 **함께 사라져** 확대돼 있던 사진이 원래 크기로 툭 되돌아간다
     (그 상태로 페이드아웃되어 "전환 직전에 화면이 튀는" 것처럼 보였다).
     .kb-run은 그 레이어가 다시 쓰일 때(=보이지 않을 때)만 벗기므로 끝까지 확대된 채 사라진다. */
  .share-view.fx-kenburns img.photo-layer.kb-run { animation: kenburns var(--kb-duration, 12s) ease-out both; }
  .share-caption {
    position: absolute; right: 20px; bottom: 68px; z-index: 5; pointer-events: none; text-align: right;
    color: rgba(200,200,200,0.55); font-size: 13px; line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  /* 음악 버튼: 기본은 "소리 꺼짐(사선 있는 음표)", 소리 켜지면 사선 없는 음표 */
  #btn-music .icon-music-on { display: none; }
  #btn-music.playing .icon-music-off { display: none; }
  #btn-music.playing .icon-music-on { display: block; }
  /* 슬라이드 버튼: 재생 중이면 ⏸(멈춤 가능), 멈춘 상태면 ▶(재개 가능) */
  #btn-slide .icon-play { display: none; }
  #btn-slide.paused .icon-pause { display: none; }
  #btn-slide.paused .icon-play { display: block; }
  /* 동영상 재생 중 등 저장할 수 없을 때 */
  .icon-btn:disabled { opacity: 0.25; cursor: not-allowed; }
  /* PIN 입력 화면 (사진 위 전체를 덮어 재생 전 차단) */
  .pin-gate {
    position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(6, 10, 20, 0.92); backdrop-filter: blur(6px); padding: 24px;
  }
  .pin-card {
    background: rgba(13, 20, 36, 0.96); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 30px 32px; max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
  }
  .pin-logo { width: 46px; height: 46px; border-radius: 12px; margin-bottom: 10px; }
  .pin-card h2 { margin: 0 0 8px; font-size: 19px; }
  .pin-card p { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; margin: 0 0 16px; }
  .pin-card p b { color: var(--text-main); }
  .pin-entry {
    width: 160px; text-align: center; letter-spacing: 10px; font-size: 26px; font-weight: 700;
    background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff;
    border-radius: 10px; padding: 12px 10px; font-family: inherit; margin-bottom: 12px;
  }
  .pin-card .btn-primary { width: 100%; }
  .pin-card .error { margin: 0 0 10px; }
  .share-loading, .share-error {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 15px; text-align: center; padding: 24px;
  }
  /* 링크를 눌러 들어온 직후에는 사진이 아직 안 받아져 화면이 새까맣게 비어 보였다.
     그 동안 wepic 로고를 띄우고, 뒤에는 이 wepic의 첫 사진을 아주 희미하게 깔아 둔다
     (썸네일이라 금방 받아진다 → "빈 화면"이 아니라 곧 나올 사진이 어렴풋이 비친다). */
  .share-loading { z-index: 15; background: #05070d; }
  .splash-photo {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 0.8s ease;
    filter: blur(24px) brightness(0.42) saturate(1.1); transform: scale(1.14);
  }
  .splash-photo.show { opacity: 1; }
  .splash-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .splash-logo {
    width: 76px; height: 76px; border-radius: 20px; opacity: 0.92;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.55);
    animation: splashPulse 2.2s ease-in-out infinite;
  }
  .splash-name { font-size: 20px; font-weight: 700; letter-spacing: 1.5px; color: rgba(255,255,255,0.92); }
  .splash-msg { font-size: 13px; color: rgba(255,255,255,0.55); }
  @keyframes splashPulse { 0%,100% { opacity: 0.92; } 50% { opacity: 0.6; } }

  /* 지금 화면을 함께 보고 있는 사람 수 — 나 말고 다른 사람이 있을 때만 나타난다 */
  .viewers-pill {
    position: absolute; right: 16px; top: 16px; z-index: 8;
    background: linear-gradient(rgba(11, 15, 23, 0.78), rgba(18, 24, 36, 0.78));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; font-weight: 700; color: #cfe0ff;
    display: flex; align-items: center; gap: 6px; pointer-events: none;
  }
  .viewers-pill .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #6ee7a8;
    box-shadow: 0 0 0 0 rgba(110, 231, 168, 0.6); animation: viewerBeat 2s ease-out infinite;
  }
  @keyframes viewerBeat {
    0% { box-shadow: 0 0 0 0 rgba(110, 231, 168, 0.55); }
    70% { box-shadow: 0 0 0 8px rgba(110, 231, 168, 0); }
    100% { box-shadow: 0 0 0 0 rgba(110, 231, 168, 0); }
  }
  /* 참여 인원 알약이 떠 있으면 알림 팝업은 그 아래에서 시작한다(서로 겹치지 않게) */
  body.has-viewers .live-popups { top: 56px; }

  /* 확대 배율 표시 — 줌 조작 중에만 잠깐 보인다 */
  .zoom-badge {
    position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 8;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
    border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700;
    color: rgba(255,255,255,0.9); pointer-events: none;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .zoom-badge.show { opacity: 1; }
  .tap-hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 8; background: rgba(0,0,0,0.35); color: #fff; font-size: 15px; cursor: pointer;
  }
  .tap-hint span { background: rgba(0,0,0,0.5); padding: 12px 22px; border-radius: 24px; backdrop-filter: blur(4px); }
  /* 조작 아이콘은 사진을 방해하지 않도록 작고 희미하게 둔다. 다만 우측 하단 캡션(날짜·곡목,
     rgba(200,200,200,0.55))보다는 조금 더 흰색이어서 "누를 수 있는 것"으로 보이게 한다. */
  .share-view .icon-btn {
    width: 30px; height: 30px; opacity: 1;
    background: rgba(0,0,0,0.26); color: rgba(238,238,238,0.68);
  }
  .share-view .icon-btn svg { width: 14px; height: 14px; }
  .share-view .icon-btn:hover { background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.95); }
  /* 아이콘이 11개나 되다 보니 폭이 좁은 기기에서는 줄이 화면 밖으로 밀려나 마지막
     아이콘(댓글)이 잘려 보였다. 두 겹으로 막는다:
       1) 좁은 화면에서는 아이콘 크기와 간격을 먼저 줄인다(아래 max-width 미디어쿼리)
       2) 그래도 넘치면 share.js의 fitActionRow()가 줄 전체를 필요한 만큼만 축소한다(--fit).
          아이콘 개수·글자수(좋아요 999)·기기와 무관하게 "잘리지 않는다"를 보장하는
          마지막 안전장치다. 왼쪽 아래를 기준으로 줄이므로 위치는 그대로 유지된다. */
  .share-actions {
    position: absolute; left: 16px; bottom: 16px; z-index: 6;
    display: flex; flex-wrap: nowrap; gap: 6px;
    transform: scale(var(--fit, 1)); transform-origin: left bottom;
  }
  .share-actions .fullscreen-btn { position: static; }
  /* 사진 저장은 PC에서만 노출한다(폰·태블릿 인앱 브라우저는 다운로드가 막히는 경우가 많음).
     전체화면·재생 버튼은 그대로 두고 다운로드 버튼만 숨긴다. */
  @media (hover: none), (pointer: coarse) {
    #btn-download { display: none; }
  }

  /* 좋아요·댓글은 숫자를 같이 보여주므로 동그라미가 아니라 알약 모양으로 넓힌다 */
  .share-view .icon-btn-wide { width: auto; padding: 0 10px; gap: 5px; border-radius: 15px; }
  .btn-count { font-size: 11.5px; font-weight: 700; line-height: 1; }
  #btn-like.liked { color: var(--coral); }

  /* ---- 실시간 댓글 ---- */
  /* 사진 위 좌측에 얹는다(아이콘 줄 위쪽). 사진을 가리지 않게 폭을 좁히고 반투명으로. */
  .comment-pane {
    position: absolute; left: 16px; bottom: 62px; z-index: 6;
    width: min(320px, calc(100% - 32px)); max-height: min(52vh, 420px);
    display: flex; flex-direction: column;
    /* 홈페이지 유리 카드와 같은 규칙(짙은 차콜 + 강한 블러 + 옅은 흰 테두리 + 큰 라운드) */
    background: linear-gradient(rgba(11, 15, 23, 0.68), rgba(18, 24, 36, 0.68)), var(--glass-bg);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border); border-radius: 18px;
    overflow: hidden;
  }
  .comment-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.10);
  }
  .comment-title { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.85); letter-spacing: 0.3px; }
  .comment-close {
    background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer;
    font-size: 13px; padding: 0 2px; line-height: 1;
  }
  .comment-close:hover { color: #fff; background: none; filter: none; }
  .comment-list {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px;
    display: flex; flex-direction: column; gap: 7px;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  .comment-item { font-size: 12.5px; line-height: 1.45; color: #f1f5fb; }
  .comment-item .who { font-weight: 700; color: var(--accent); margin-right: 5px; }
  .comment-item .when { color: rgba(255,255,255,0.42); font-size: 10.5px; margin-left: 5px; }
  /* 방금 새로 도착한 댓글은 살짝 밝게 떠오르게 해 눈에 띄도록 */
  .comment-item.fresh { animation: cmtIn 1.6s ease-out; }
  @keyframes cmtIn {
    from { background: rgba(255, 142, 83, 0.22); }
    to   { background: transparent; }
  }
  .comment-empty { font-size: 12px; color: rgba(255,255,255,0.45); }
  .comment-form { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid rgba(255,255,255,0.10); }
  .comment-form input {
    flex: 1; min-width: 0; font-size: 12.5px; padding: 7px 9px; border-radius: 8px;
    background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14); color: #fff;
    font-family: inherit;
  }
  .comment-send { padding: 7px 13px; font-size: 12px; font-weight: 700; border-radius: 999px; }
  .comment-note { padding: 0 10px 8px; font-size: 10.5px; color: rgba(255,255,255,0.45); line-height: 1.5; }
  /* 전체화면일 때도 그대로 보인다(사진만 보고 싶으면 ✕로 닫으면 된다) */
  @media (max-width: 600px) {
    .comment-pane { bottom: 58px; max-height: 44vh; }
    /* 좁은 화면에서는 아이콘 줄을 먼저 촘촘하게 만든다(--fit로 통째로 줄이기 전 단계).
       여기서 대부분의 폰이 한 줄에 다 들어와 --fit이 1로 유지된다. */
    .share-actions { gap: 4px; left: 12px; }
    .share-view .icon-btn { width: 28px; height: 28px; }
    .share-view .icon-btn svg { width: 13px; height: 13px; }
    .share-view .icon-btn-wide { padding: 0 7px; gap: 4px; border-radius: 14px; }
  }

  /* ---- 실시간 알림 팝업 (좋아요·댓글·새 접속) ----
     사진 오른쪽 위에서 떠올라 잠깐 머물고 사라진다. 사진을 가리지 않게 폭을 제한한다. */
  .live-popups {
    position: absolute; right: 16px; top: 16px; z-index: 7;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    max-width: min(300px, calc(100% - 32px)); pointer-events: none;
  }
  .live-pop {
    max-width: 100%;
    background: linear-gradient(rgba(11, 15, 23, 0.78), rgba(18, 24, 36, 0.78));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border); border-radius: 14px;
    padding: 8px 12px; font-size: 12.5px; line-height: 1.45; color: #f1f5fb;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
    /* 떠오르면서 나타나고, 마지막 0.5초에 사라진다(총 표시 시간은 JS의 LIVE_POP_MS와 맞춘다) */
    animation: livePopIn 0.28s ease-out, livePopOut 0.5s ease-in forwards;
    animation-delay: 0s, calc(var(--pop-life, 4s) - 0.5s);
  }
  .live-pop b { color: #fff; }
  .live-pop .live-pop-who { color: var(--peach); font-weight: 700; margin-right: 5px; }
  .live-pop.like { color: #ffd7d0; }
  .live-pop.join { color: #cfe0ff; }
  @keyframes livePopIn  { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes livePopOut { to { opacity: 0; transform: translateY(-6px); } }

  /* ---- 빈화면 모드 ----
     사진만 남긴다. 제목·사진번호·촬영일/곡명·진행바·댓글창을 감추고, 아이콘 줄에서는
     "빈화면 해제"와 "화면 작게(전체화면 토글)" 두 개만 남긴다. */
  body.clean #share-title,
  body.clean #share-counter,
  body.clean #share-caption,
  body.clean #ambient-widget,
  body.clean .progress-strip,
  body.clean .viewers-pill,
  body.clean .comment-pane { display: none !important; }
  /* ⚠️ !important가 필요하다 — #btn-music은 JS가 인라인 style.display를 직접 넣는데
     (미리듣기/유튜브 유무에 따라 flex/none), 인라인 스타일은 보통 규칙보다 우선이라
     !important 없이는 빈화면에서도 음표 아이콘이 남는다. */
  body.clean .share-actions > * { display: none !important; }
  body.clean .share-actions > #btn-clean,
  body.clean .share-actions > #btn-fullscreen { display: flex !important; }

  /* 빈화면에서는 그 두 아이콘도 조용히 숨어 있다가, 손을 대면 3초만 나타난다.
     visibility까지 끄지 않으면 안 보이는 버튼이 눌린다. */
  body.clean.ui-hidden .share-actions {
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  body.clean .share-actions { transition: opacity 0.2s ease; }

  /* 빈화면 아이콘: 켜져 있을 때만 "해제" 모양(줄이 있는 쪽)을 보여준다 */
  #btn-clean .icon-clean-off { display: none; }
  body.clean #btn-clean .icon-clean-on { display: none; }
  body.clean #btn-clean .icon-clean-off { display: block; }
  body.clean #btn-clean { opacity: 1; }
</style>
</head>
<body>
  <div class="share-view">
    <!-- 사진·동영상 레이어를 감싼 "무대". 줌인/줌아웃은 이 무대를 통째로 확대·이동시킨다. -->
    <div class="photo-stage" id="photo-stage">
      <!-- 세로 사진 등으로 생기는 검은 여백을 메우는 흐린 배경(styles.css의 .photo-backdrop).
           사진 레이어보다 뒤에 깔리도록 DOM에서 먼저 둔다. -->
      <img class="photo-backdrop" id="photo-a-bg" alt="" aria-hidden="true" />
      <img class="photo-backdrop" id="photo-b-bg" alt="" aria-hidden="true" />
      <img class="photo-layer" id="photo-a" />
      <img class="photo-layer" id="photo-b" />
      <!-- 동영상 항목 재생용 레이어 (사진과 같은 자리에 겹쳐 표시) -->
      <video class="photo-layer" id="video-layer" playsinline preload="metadata"></video>
    </div>

    <div id="share-title" class="title-overlay hidden"></div>
    <!-- 제목 바로 아래, 제목과 같은 크기로 "3 / 10"처럼 몇 번째 사진인지 알려준다 -->
    <div id="share-counter" class="title-counter hidden"></div>

    <!-- 시계·날씨 (우측 상단) — 메인화면과 같은 마크업·CSS(styles.css의 .ambient-widget).
         켤지 말지는 wepic을 만들 때의 설정이 매니페스트(ambient)로 함께 전달된다. -->
    <div id="ambient-widget" class="ambient-widget hidden">
      <div id="amb-time" class="amb-time"></div>
      <div id="amb-date" class="amb-date"></div>
      <div id="amb-weather" class="amb-weather"></div>
    </div>

    <!-- 첫 사진이 준비될 때까지 보여주는 시작 화면 (로고 + 첫 사진을 희미하게) -->
    <div id="share-loading" class="share-loading">
      <img class="splash-photo" id="splash-photo" alt="" aria-hidden="true" />
      <div class="splash-inner">
        <img class="splash-logo" src="/icon-192-v2.png" alt="Wepic" />
        <div class="splash-name">Wepic</div>
        <div class="splash-msg" id="splash-msg">사진을 불러오는 중...</div>
      </div>
    </div>
    <div id="share-error" class="share-error hidden"></div>

    <!-- PIN 입력: PIN이 걸린 공유는 맞는 번호를 넣기 전까지 사진이 재생되지 않는다 -->
    <div id="pin-gate" class="pin-gate hidden">
      <div class="pin-card">
        <img class="pin-logo" src="/favicon.svg" alt="" />
        <h2>PIN 번호 입력</h2>
        <p>공유해 주신 분에게 받은 <b>4자리 숫자</b>를 입력하세요.</p>
        <input type="text" id="pin-entry" class="pin-entry" maxlength="4" inputmode="numeric"
               pattern="[0-9]*" autocomplete="off" placeholder="----" />
        <p id="pin-error" class="error hidden"></p>
        <button id="pin-submit" class="btn-primary">확인</button>
      </div>
    </div>

    <div class="share-actions">
      <button id="btn-fullscreen" class="icon-btn fullscreen-btn" title="전체 화면 (Esc로 복귀)">
        <svg class="icon-expand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
        <svg class="icon-shrink" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
          <path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
        </svg>
      </button>

      <!-- 빈화면: 사진만 남기고 제목·번호·아이콘·촬영일/곡명·진행바를 모두 감춘다.
           벽에 걸어두는 전자액자처럼 보이게 하는 모드다. -->
      <button id="btn-clean" class="icon-btn" title="빈화면 (사진만 보기)">
        <svg class="icon-clean-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
        </svg>
        <svg class="icon-clean-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="9" x2="8" y2="20"/>
        </svg>
      </button>

      <button id="btn-home" class="icon-btn" title="메인 홈으로 이동">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5"/>
          <path d="M5.5 9.5V19a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4h4v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V9.5"/>
        </svg>
      </button>

      <!-- 배경음악 소리 on/off (음표 아이콘으로 "음악"임을 구분) -->
      <button id="btn-music" class="icon-btn" title="배경음악 소리 켜기" style="display:none;">
        <svg class="icon-music-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
          <line x1="3" y1="3" x2="21" y2="21"/>
        </svg>
        <svg class="icon-music-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
        </svg>
      </button>

      <!-- 이전 사진으로 (자동 전환을 기다리지 않고 직접 넘긴다) -->
      <button id="btn-prev" class="icon-btn" title="이전 사진">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5 8 12l7 7"/>
        </svg>
      </button>

      <!-- 사진 슬라이드 멈춤/재개 (▶/⏸ 아이콘으로 "슬라이드"임을 구분) -->
      <button id="btn-slide" class="icon-btn" title="사진 슬라이드 멈춤">
        <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>
        </svg>
        <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <polygon points="7,5 19,12 7,19"/>
        </svg>
      </button>

      <!-- 다음 사진으로 -->
      <button id="btn-next" class="icon-btn" title="다음 사진">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </button>

      <!-- 확대 / 축소. 조작하는 동안에는 사진 넘김이 10초 동안 멈춘다(share.js의 ZOOM_HOLD_MS). -->
      <button id="btn-zoom-in" class="icon-btn" title="확대">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
          <path d="M11 8v6"/><path d="M8 11h6"/>
        </svg>
      </button>
      <button id="btn-zoom-out" class="icon-btn" title="축소">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
          <path d="M8 11h6"/>
        </svg>
      </button>

      <!-- 누르면 현재 사진 1장을 바로 저장 -->
      <button id="btn-download" class="icon-btn" title="이 사진 저장">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/>
        </svg>
      </button>

      <!-- 좋아요 (로그인 없이도 누를 수 있다) -->
      <button id="btn-like" class="icon-btn icon-btn-wide" title="좋아요">
        <svg class="icon-heart" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20s-7-4.4-7-9.3A4 4 0 0 1 12 7a4 4 0 0 1 7 3.7C19 15.6 12 20 12 20z"/>
        </svg>
        <span id="like-count" class="btn-count">0</span>
      </button>

      <!-- 댓글 열기/닫기 (사진을 보면서 바로 쓸 수 있다) -->
      <button id="btn-comments" class="icon-btn icon-btn-wide" title="댓글">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a7.5 7.5 0 0 1-7.5 7.5H8l-4 3v-4.6A7.5 7.5 0 0 1 13.5 4.5 7.5 7.5 0 0 1 21 12z"/>
        </svg>
        <span id="comment-count" class="btn-count">0</span>
      </button>
    </div>

    <!-- 실시간 댓글 — 사진을 보는 중에도 좌측에서 읽고 아래에서 바로 쓸 수 있다.
         로그인하지 않아도 쓸 수 있고, 그때는 "색깔 동물" 별명이 붙는다. -->
    <div id="comment-pane" class="comment-pane hidden">
      <div class="comment-head">
        <span class="comment-title">함께 남긴 글</span>
        <button id="btn-comment-close" class="comment-close" title="닫기" aria-label="댓글 닫기">✕</button>
      </div>
      <div id="comment-list" class="comment-list"></div>
      <div class="comment-form">
        <input id="comment-input" type="text" maxlength="50" placeholder="한마디 남기기 (50자)"
               autocomplete="off" />
        <button id="btn-comment-send" class="comment-send">보내기</button>
      </div>
      <div id="comment-note" class="comment-note"></div>
    </div>

    <div id="share-caption" class="share-caption"></div>

    <!-- 지금 함께 보고 있는 사람 수. 나 혼자면 아예 나타나지 않는다. -->
    <div id="viewers-pill" class="viewers-pill hidden" aria-live="polite">
      <span class="dot"></span><span id="viewers-text"></span>
    </div>

    <!-- 확대 배율 표시(줌 조작 중에만) -->
    <div id="zoom-badge" class="zoom-badge">100%</div>

    <!-- 같이 보는 사람의 좋아요·댓글, 새 접속 알림이 잠깐 떠올랐다 사라지는 자리 -->
    <div id="live-popups" class="live-popups" aria-live="polite"></div>

    <div id="toast" class="toast hidden"></div>
    <div class="progress-strip"><div id="progress-strip-fill" class="progress-strip-fill"></div></div>
    <div class="yt-host"><div id="yt-player"></div></div>
  </div>

  <script src="/share.js?v=20260808e"></script>
</body>
</html>
